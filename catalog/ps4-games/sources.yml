# PS4 catalog source registry.
# Public discovery endpoints are not package mirrors. Only add a pkgPath to repo.yml
# when the package is redistributable and the direct URL has been verified.
name: PS4 Catalog Sources
platform: PS4
sources:
  - id: brewology-ps4
    name: Brewology PS4 Homebrew
    kind: homebrew
    catalog_url: https://store.brewology.com/ps4/
    games_url: https://store.brewology.com/ps4/games/
    policy: homebrew_only
    status: discovery
    notes: Public catalog of PS4 homebrew; individual releases are linked to developers or hosted copies.
  - id: pkg-zone
    name: PKG-Zone Homebrew Store
    kind: homebrew
    catalog_url: https://pkg-zone.com/
    policy: homebrew_only
    status: discovery
    notes: Homebrew store for PS4 and PS5; use its public app pages to verify each package.
  - id: playstation-store
    name: PlayStation Store
    kind: commercial_metadata
    catalog_url: https://store.playstation.com/
    policy: official_commercial_metadata
    status: metadata_only
    notes: Official commercial catalog and product metadata; not a redistributable PKG feed.
  - id: authorized-publisher-feed
    name: Publisher or license-holder feed
    kind: commercial_distribution
    catalog_url: null
    policy: explicit_distribution_authorization_required
    status: awaiting_feed
    notes: Add the license-holder's direct package manifest here; never infer package URLs from title names.
