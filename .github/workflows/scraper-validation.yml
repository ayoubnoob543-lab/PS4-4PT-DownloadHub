name: Validate SuperPSX scraper

on:
  push:
    branches:
      - feat/download-reliability-throughput
    paths:
      - "scripts/scrape_superpsx_full_catalog.py"
      - ".github/workflows/superpsx-extract.yml"
      - ".github/workflows/scraper-validation.yml"
  pull_request:
    paths:
      - "scripts/scrape_superpsx_full_catalog.py"
      - ".github/workflows/superpsx-extract.yml"
      - ".github/workflows/scraper-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Compile scraper
        run: python -m py_compile scripts/scrape_superpsx_full_catalog.py
      - name: Check host ranking and link classification
        run: |
          python - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location("scraper", "scripts/scrape_superpsx_full_catalog.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          expected = [
              ("cdn.mocha.my", 0, "mocha"),
              ("filecrypt.cc", 1, "filecrypt"),
              ("vikingfile.com", 2, "vikingfile"),
              ("1fichier.com", 3, "1fichier"),
          ]
          for host, priority, family in expected:
              assert module.host_info(host) == (priority, family), (host, module.host_info(host))
          assert module.kind("Game Update 1.02") == "update"
          assert module.kind("DLC pack") == "dlc"
          assert module.kind("Full Game") == "game"
          print("Scraper validation passed.")
          PY
