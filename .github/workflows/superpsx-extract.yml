name: SuperPSX catalog extraction

run-name: SuperPSX catalog · limit ${{ inputs.limit || '0' }} · start ${{ inputs.start || '0' }}

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Games to process (0 = all)"
        type: number
        required: true
        default: 0
      start:
        description: "Resume offset (0 = from the beginning)"
        type: number
        required: true
        default: 0
      delay:
        description: "Delay between games in seconds"
        type: number
        required: true
        default: 1.2
  schedule:
    - cron: "15 3 * * 0"

permissions:
  contents: write

concurrency:
  group: superpsx-full-catalog
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout scraper branch
        uses: actions/checkout@v4
        with:
          ref: feat/download-reliability-throughput

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade requests beautifulsoup4

      - name: Extract full catalog
        env:
          GAME_LIMIT: ${{ inputs.limit || '0' }}
          START_AT: ${{ inputs.start || '0' }}
          REQUEST_DELAY: ${{ inputs.delay || '1.2' }}
        run: |
          python scripts/scrape_superpsx_full_catalog.py \\
            --limit "$GAME_LIMIT" \\
            --start "$START_AT" \\
            --delay "$REQUEST_DELAY"

      - name: Publish compressed catalog to repository
        if: always()
        run: |
          set -e
          SOURCE="catalog/ps4-games/superpsx-full-catalog-links.json"
          TARGET="catalog/ps4-games/superpsx-full-catalog-links.json.gz"
          if [ ! -s "$SOURCE" ]; then
            echo "No catalog JSON found; skipping repository publish."
            exit 0
          fi
          gzip -9 -c "$SOURCE" > "$TARGET"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$TARGET"
          if git diff --cached --quiet; then
            echo "Compressed catalog unchanged; no commit needed."
            exit 0
          fi
          git commit -m "data: update compressed SuperPSX catalog"
          git push origin HEAD:feat/download-reliability-throughput

      - name: Write run summary
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib, os
          path = pathlib.Path("catalog/ps4-games/superpsx-full-catalog-links.json")
          summary = pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"])
          if not path.exists():
              summary.write_text("## Catalog extraction\\nNo output JSON was produced. Check the extraction step logs.\\n")
          else:
              data = json.loads(path.read_text(encoding="utf-8"))
              summary.write_text(
                  "## Catalog extraction\\n"
                  f"- Processed: {data.get('processed', 0)} / {data.get('total_in_run', 0)}\\n"
                  f"- Visible links: {len(data.get('links', []))}\\n"
                  f"- Errors: {len(data.get('errors', []))}\\n"
                  "- Compressed JSON is published in the repository when available.\\n"
              )
          PY

      - name: Upload partial or complete catalog
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: superpsx-full-catalog-links
          path: catalog/ps4-games/superpsx-full-catalog-links.json
          if-no-files-found: warn
          retention-days: 30
