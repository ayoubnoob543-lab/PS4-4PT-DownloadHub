name: SuperPSX catalog extraction

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of games (0 = all)"
        required: false
        default: "0"
      start:
        description: "Resume offset"
        required: false
        default: "0"
  push:
    branches:
      - master
    paths:
      - .github/workflows/superpsx-extract.yml
  schedule:
    - cron: "15 3 * * 0"

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout scraper branch
        uses: actions/checkout@v4
        with:
          ref: feat/download-reliability-throughput
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade requests beautifulsoup4
      - name: Extract games, updates, DLC and visible mirrors
        env:
          GAME_LIMIT: ${{ inputs.limit || '0' }}
          START_AT: ${{ inputs.start || '0' }}
        run: python scripts/scrape_superpsx_full_catalog.py --limit "$GAME_LIMIT" --start "$START_AT"
      - name: Upload extracted catalog
        uses: actions/upload-artifact@v4
        with:
          name: superpsx-full-catalog-links
          path: catalog/ps4-games/superpsx-full-catalog-links.json
          if-no-files-found: error
          retention-days: 30
